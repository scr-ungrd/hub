<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 48 48">
  <!-- base plate -->
  <ellipse fill="#087283" cx="24" cy="44.5" rx="9" ry="1.6"/>
  <!-- lattice tower: two tapered rails -->
  <path fill="none" stroke="#087283" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
        d="M15 44 L20.5 25 M33 44 L27.5 25"/>
  <!-- rungs -->
  <path fill="none" stroke="#087283" stroke-width="1.8" stroke-linecap="round"
        d="M17.4 35.5 L30.6 35.5 M19.2 30 L28.8 30"/>
  <!-- cross braces (X pattern) between rungs -->
  <path fill="none" stroke="#087283" stroke-width="1.4" stroke-linecap="round"
        d="M15 44 L19.2 30 M33 44 L28.8 30 M17.4 35.5 L20.5 25 M30.6 35.5 L27.5 25"/>
  <!-- mount neck from tower top to back of dish -->
  <path fill="none" stroke="#087283" stroke-width="2.2" stroke-linecap="round" d="M24 25 L21 19.5"/>
  <!-- dish (thick bowl/scoop shape) -->
  <path fill="#087283" d="M 6.96 14.53 A 16 16 0 0 1 36.50 13.24 L 27.89 17.25 A 6.5 6.5 0 0 0 15.89 17.78 Z"/>
  <!-- signal waves -->
  <path fill="none" stroke="#087283" stroke-width="2.2" stroke-linecap="round" d="M41 12 A9 9 0 0 0 34 1"/>
  <path fill="none" stroke="#087283" stroke-width="2.2" stroke-linecap="round" d="M47 13 A16.5 16.5 0 0 0 34 -6"/>
</svg>
